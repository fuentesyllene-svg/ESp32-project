; Detection node - AI-Thinker ESP32-CAM
;
; Optional: this project also builds with PlatformIO, from the same files the
; Arduino IDE uses. The Arduino IDE ignores this file.
; Disconnect the GPIO13/GPIO14 link wires before flashing.

[platformio]
src_dir = .

[env:cam_node]
platform  = espressif32@^6.9.0
board     = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed  = 460800

board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
