; Detection node - AI-Thinker ESP32-CAM
; Build:  pio run -e cam_node
; Flash:  pio run -e cam_node -t upload   (GPIO0 -> GND, then reset)
;
; Disconnect the GPIO13/GPIO14 link wires before flashing.

[env:cam_node]
platform  = espressif32@^6.9.0
board     = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed  = 460800

board_build.partitions = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -Wall
